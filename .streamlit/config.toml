# .streamlit/config.toml
# RixterProphet Analytics - Forex Edition
# Professional Blue-Charcoal Theme Configuration

[theme]
# Primary color - Elegant blue for professional look
primaryColor = "#3498db"

# Background color - Clean white
backgroundColor = "#ffffff"

# Secondary background - Light gray
secondaryBackgroundColor = "#f8f9fa"

# Text color - Dark charcoal
textColor = "#2c3e50"

# Font - Clean sans-serif
font = "sans-serif"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10
maxMessageSize = 200
enableCORS = true
enableXsrfProtection = true

[logger]
level = "info"
messageFormat = "%(asctime)s %(levelname)s %(message)s"

[runner]
fastReruns = true

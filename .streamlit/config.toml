# .streamlit/config.toml
# RixterProphet Analytics - Forex Edition
# Dark Luxury Theme Configuration

[theme]
# Primary color - Gold accent for luxury feel
primaryColor = "#c9a84c"

# Background color - Deep charcoal black
backgroundColor = "#0d1117"

# Secondary background - Slightly lighter dark
secondaryBackgroundColor = "#161b22"

# Text color - Soft white for readability
textColor = "#e6edf3"

# Font - Clean sans-serif
font = "sans-serif"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10
maxMessageSize = 200
enableCORS = true
enableXsrfProtection = true

[logger]
level = "info"
messageFormat = "%(asctime)s %(levelname)s %(message)s"

[runner]
fastReruns = true
